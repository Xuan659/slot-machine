<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>幸運點名機｜教室拉霸抽籤</title><style>

d7d7c9,#fffdf1 28%,#fffdf1 70%,#d2d3c4);border:2px solid #776e51;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 0 12px #474f4133}.reel small{font-size:24px;opacity:.4;line-height:30px}.num{font-family:Georgia,serif;font-size:66px;font-weight:bold;color:#c64a35;text-shadow:1px 2px #fff}.reel.spinning .num{animation:roll .06s infinite}.reel label{font-size:11px;color:#827961}.console{display:flex;justify-content:space-between;align-items:center;padding:18px 8px 10px;color:#f5d98e;font-size:12px;letter-spacing:2px}.slot{width:95px;height:15px;background:#102b23;border-radius:20px;border-bottom:3px solid #66836b}.lever{position:absolute;right:-35px;top:143px;width:30px;height:142px;border:none;background:none;padding:0;transform-origin:bottom}.lever:before{content:'';position:absolute;width:12px;height:105px;background:linear-gradient(90deg,#9aa49a,#edf0df,#738677);left:10px;top:25px;border:1px solid #697d68}.lever:after{content:'';position:absolute;top:0;left:-3px;width:39px;height:39px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fa9c7e,#ce4432 55%,#812b23);box-shadow:0 4px 3px #0003}.lever:active{transform:rotate(20deg)}.draw{width:100%;margin-top:30px;padding:17px;background:#c94b37;color:#fff9e9;border:0;box-shadow:0 4px 0 #9a382a;font-size:18px;letter-spacing:2px}.hint{font-size:12px;color:#798576;margin:17px 0 0}.panel{background:#fffdf7;border:1px solid #e2dfd2;border-radius:16px;padding:24px}.panel h3{margin:0 0 24px;font-size:19px}.field{margin-bottom:24px}.field label{display:block;font-size:13px;font-weight:bold;margin-bottom:10px}.field input{width:100%;padding:13px;background:#f6f4ed;border:1px solid #dcded1;border-radius:9px;font-size:21px;color:#274b3f}.field small{display:block;color:#92958a;font-size:11px;margin-top:8px}.stats{display:flex;justify-content:space-between;border-top:1px solid #e6e3d7;padding-top:18px;font-size:12px;color:#7b8279}.stats strong{font-size:25px;color:#305443;display:block;margin-top:7px}.reset{width:100%;margin-top:22px}.note{font-size:12px;color:#8b8f82;line-height:1.7;margin:17px 5px}.results{margin-top:30px}.result-head{display:flex;justify-content:space-between;align-items:center}.result-head h3{font-size:17px}.tag{font-size:11px;color:#6d7d6b;background:#e7ecdf;padding:7px 10px;border-radius:20px}.chips{display:flex;gap:10px;flex-wrap:wrap;min-height:65px;align-items:center}.chip{background:#fffdf7;border:1px solid #dcd9c9;padding:13px 18px;border-radius:10px;color:#ba4935;font-weight:bold;font-size:23px}.empty{font-size:13px;color:#8d9387}.history{margin:20px 0;color:#7d8779;font-size:12px;line-height:2}.toast{min-height:24px;color:#b44130;font-size:13px;margin-top:10px}footer{text-align:center;color:#9a9d90;font-size:11px;padding:25px}.compact header,.compact .heading,.compact aside,.compact footer,.compact .history,.compact .result-head{display:none}.compact main{margin:10px auto;padding:0 12px}.compact .layout{display:block}.compact .stage{padding:15px 40px 15px 18px}.compact .marquee{padding:7px}.compact .marquee h2{font-size:23px}.compact .reel{height:105px}.compact .num{font-size:46px}.compact .console{padding:9px}.compact .draw{margin-top:19px;padding:12px}.compact .hint{display:none}.compact .results{margin:12px 0}.compact .chips{min-height:0}.compact .chip{font-size:18px;padding:7px 12px}.compact .mini-reset{display:block;width:100%;margin-top:15px}.mini-reset{display:none}@keyframes roll{from{transform:translateY(-24px);filter:blur(2px)}to{transform:translateY(24px);filter:blur(3px)}}@media(max-width:850px){.layout{grid-template-columns:1fr}.panel{margin-top:0}h1{font-size:30px}header{padding:18px}.stage{padding:24px 35px 24px 20px}.top-actions button{padding:9px;font-size:12px}main{padding:0 16px;margin-top:25px}.num{font-size:50px}.marquee h2{font-size:27px}.reel{height:145px}}@media(prefers-reduced-motion:reduce){.reel.spinning .num{animation:none}}

/* Every visible part of the lever sits inside its button hit area. */
.lever{right:-51px;top:143px;width:52px;height:145px;z-index:3;touch-action:manipulation}
.lever:before{left:20px;pointer-events:none}.lever:after{left:7px;pointer-events:none}
.lever:focus-visible{outline:3px solid #e8b855;outline-offset:3px}
.reels{grid-template-columns:repeat(var(--columns,1),minmax(0,1fr))}
.reels.many .reel{height:115px}.reels.many .num{font-size:38px}
.reels.many .reel small{font-size:14px;line-height:18px}
body.compact{background:#234d3e;min-width:280px}
.compact header,.compact .heading,.compact aside,.compact footer,.compact .results,.compact .marquee,.compact .console,.compact .hint,.compact .stage:before{display:none}
.compact main{margin:0;padding:8px;max-width:none}.compact .layout{display:block}
.compact .stage{padding:8px 55px 8px 8px;border-radius:12px;background:#234d3e;overflow:visible;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.compact .machine{grid-column:1 / -1;margin:0;padding:0;border:0;background:none;border-radius:8px;box-shadow:none;min-width:0}
.compact .reel-frame{margin:0;padding:5px;border-radius:9px}
.compact .reels{gap:5px;grid-template-columns:repeat(var(--columns,1),minmax(58px,1fr));overflow-x:auto}
.compact .reel,.compact .reels.many .reel{height:100px;min-width:58px}
.compact .num,.compact .reels.many .num{font-size:36px;line-height:1.1}
.compact .reel small{display:none}.compact .reel label{font-size:10px;margin-top:5px}
.compact .lever{right:-51px;top:0;height:112px;width:48px}
.compact .lever:before{height:83px;left:18px}.compact .lever:after{left:4px}
.compact .draw{grid-column:1;margin:0;padding:8px;font-size:13px;letter-spacing:0;box-shadow:none}
.compact .mini-reset{display:block;width:auto;margin:0;padding:8px;font-size:12px}
.compact .toast{color:#fff1c9;margin:0;font-size:11px;min-height:0;line-height:1.5}
@media(max-width:600px){body:not(.compact) .reels{grid-template-columns:repeat(var(--mobile-columns,1),minmax(0,1fr))}.reels.many .num{font-size:30px}.reels.many .reel{height:105px}.stage{padding-right:42px}}

/* Fixed hit area; only the shaft and knob move toward the viewer. */
.lever{perspective:350px;--pull-travel:84px;background:radial-gradient(ellipse 16px 10px at 50% calc(100% - 14px),#102b23 60%,#8c9b85 65%,transparent 75%)}
.lever:active{transform:none}
.lever:before{transform-origin:50% 100%;backface-visibility:hidden}
.lever.pulled:before{animation:shaft-pull .5s cubic-bezier(.3,.05,.25,1) both}
.lever.pulled:after{animation:knob-pull .5s cubic-bezier(.3,.05,.25,1) both}
.compact .lever{--pull-travel:62px}
@keyframes shaft-pull{0%,100%{transform:rotateX(0deg)}42%,58%{transform:rotateX(-76deg) scaleX(1.2)}}
@keyframes knob-pull{0%,100%{transform:translateY(0) scale(1);box-shadow:0 4px 3px #0003}42%,58%{transform:translateY(var(--pull-travel)) scale(1.22);box-shadow:0 12px 9px #0005}}
@media(prefers-reduced-motion:reduce){.lever.pulled:before,.lever.pulled:after{animation-duration:.01ms}}
</style></head><body><header><div class="brand"><b>✦</b>幸運點名機</div><div class="top-actions"><button id="sound">♫ 音效：關</button><button id="float">▣ 開啟懸浮視窗</button></div></header><main><div class="heading"><div class="eyebrow">A LITTLE LUCK, A LOT OF FUN</div><h1>今天的幸運同學是誰？</h1><p class="intro">拉一下，把期待轉起來。讓每一次點名，都有一點驚喜。</p></div><div class="layout"><section><div class="stage"><div class="machine"><div class="marquee"><small>★ CLASSROOM EDITION ★</small><h2>幸運點名機</h2><p>LUCKY NUMBER CLUB</p></div><div class="reel-frame"><div class="reels" id="reels"></div></div><div class="console"><span>✦ GOOD LUCK ✦</span><div class="slot"></div><span>NO. <span id="round">01</span></span></div><button class="lever" aria-label="拉下拉桿抽籤" id="lever"></button></div><button class="draw" id="draw">✦ 開始抽籤</button><p class="hint">點擊按鈕或拉桿，讓幸運轉起來</p><button class="mini-reset" id="miniReset">↺ 全部重來</button></div><section class="results"><div class="result-head"><h3>✧ 本次幸運座號</h3><span class="tag">不重複抽選</span></div><div class="chips" id="results" aria-live="polite"></div><div class="history" id="history"></div></section></section><aside><div class="panel"><h3>抽籤設定</h3><div class="field"><label for="total">班上總人數</label><input id="total" type="number" min="1" max="999" value="27"><small>座號從 1 號開始，最多 999 人</small></div><div class="field"><label for="count">這次抽幾人？</label><input id="count" type="number" min="1" max="27" value="1"><small>同一輪內不重複，人人都有機會</small></div><div class="stats"><div>尚未抽出<strong id="remaining">27 人</strong></div><div>已抽出<strong id="used">0 人</strong></div></div><button class="reset" id="reset">↺ 全部重來</button></div><p class="note">✧ 調整總人數會開始新的一輪。<br>懸浮視窗與這裡同步，切換教材也能抽籤。</p></aside></div><div class="toast" id="toast" role="status"></div></main><footer>每個座號，都值得被期待。 ✦</footer><script>
const $=id=>document.getElementById(id);const key='lucky-class-v1';let s={total:27,count:1,used:[],last:[],history:[],round:0},busy=false,sound=false,pop=null;try{const a=JSON.parse(localStorage.getItem(key));if(a&&Number.isInteger(a.total)&&a.total>0&&a.total<=999&&Array.isArray(a.used)&&Array.isArray(a.last)&&Array.isArray(a.history))s=a}catch{};const compact=new URLSearchParams(location.search).has('compact');if(compact)document.body.classList.add('compact');
function save(){try{localStorage.setItem(key,JSON.stringify(s))}catch{}render()}
function render(){ $('total').value=s.total;$('count').value=s.count;$('count').max=s.total;$('remaining').textContent=(s.total-s.used.length)+' 人';$('used').textContent=s.used.length+' 人';$('round').textContent=String(s.round+1).padStart(2,'0');$('results').innerHTML=s.last.length?s.last.map(n=>'<span class="chip">'+String(n).padStart(2,'0')+' <small>號</small></span>').join(''):'<span class="empty">準備好了嗎？下一位幸運同學，等你揭曉。</span>';$('history').textContent=s.history.length?'本輪紀錄　'+s.history.map((a,i)=>'第 '+(i+1)+' 次：'+a.join('、')+' 號').join('　／　'):'';if(!busy){$('reels').style.setProperty('--columns',Math.min(s.count,5));$('reels').style.setProperty('--mobile-columns',Math.min(s.count,3));$('reels').classList.toggle('many',s.count>3);$('reels').innerHTML=Array.from({length:s.count},(_,i)=>'<div class="reel"><small>✦</small><span class="num">'+(s.last.length===s.count?String(s.last[i]).padStart(2,'0'):'?')+'</span><label>幸運座號</label><small>✦</small></div>').join('')}for(const id of ['draw','lever','total','count','reset','miniReset'])$(id).disabled=busy;$('draw').textContent=busy?'幸運轉動中…':s.used.length===s.total?'本輪已抽完':'✦ 開始抽籤';$('draw').disabled=busy||s.used.length===s.total;$('lever').disabled=$('draw').disabled}
function rand(n){let a=new Uint32Array(1),limit=4294967296-4294967296%n;do{crypto.getRandomValues(a)}while(a[0]>=limit);return a[0]%n}
let audioContext;
function audioReady(){if(!sound)return null;try{const ctx=audioContext||(audioContext=new(window.AudioContext||window.webkitAudioContext)());ctx.resume();return ctx}catch{return null}}
function tone(ctx,freq,start,duration=.1,gain=.16,type='triangle'){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,start);o.connect(g);g.connect(ctx.destination);g.gain.setValueAtTime(.001,start);g.gain.exponentialRampToValueAtTime(gain,start+.008);g.gain.exponentialRampToValueAtTime(.001,start+duration);o.start(start);o.stop(start+duration+.01)}
function beep(freq){const ctx=audioReady();if(ctx)tone(ctx,freq,ctx.currentTime)}
function spinSound(tick){const ctx=audioReady();if(!ctx)return;const t=ctx.currentTime;const notes=[262,330,392,523,659,523,392,330];tone(ctx,notes[tick%notes.length],t,.09,.18,'square');tone(ctx,90+(tick%3)*25,t,.05,.24,'triangle')}
function winSound(){const ctx=audioReady();if(!ctx)return;[523,659,784,1047].forEach((f,i)=>tone(ctx,f,ctx.currentTime+i*.1,.3,.22));tone(ctx,523,ctx.currentTime+.3,.45,.12)}
async function draw(){if(busy)return;const remain=s.total-s.used.length;if(!remain)return;const c=Number($('count').value);if(!Number.isInteger(c)||c<1||c>remain){$('toast').textContent='請輸入 1～'+remain+' 人，或按「全部重來」。';return}s.count=c;render();busy=true;render();$('lever').classList.add('pulled');setTimeout(()=>$('lever').classList.remove('pulled'),500);audioReady();spinSound(0);$('toast').textContent='';let pool=Array.from({length:s.total},(_,i)=>i+1).filter(n=>!s.used.includes(n)),picked=[];for(let i=0;i<c;i++)picked.push(pool.splice(rand(pool.length),1)[0]);document.querySelectorAll('.reel').forEach(r=>r.classList.add('spinning'));let ticks=0;const timer=setInterval(()=>{document.querySelectorAll('.num').forEach(el=>el.textContent=String(1+rand(s.total)).padStart(2,'0'));spinSound(++ticks)},40);await new Promise(r=>setTimeout(r,700));clearInterval(timer);s.used.push(...picked);s.last=picked;s.history.push(picked);s.round++;busy=false;save();winSound();$('toast').textContent='恭喜 '+picked.join('、')+' 號同學！'+(s.used.length===s.total?' 本輪已抽完，按「全部重來」再玩一次。':'')}
function reset(){if(busy)return;s.used=[];s.last=[];s.history=[];s.round=0;$('toast').textContent='已全部重來，全班座號重新加入！';save()}
$('total').onchange=()=>{const n=Number($('total').value);if(!Number.isInteger(n)||n<1||n>999){$('toast').textContent='總人數請填 1～999 的整數。';$('total').value=s.total;return}s.total=n;s.count=Math.min(s.count,n);reset()};$('count').onchange=()=>{const n=Number($('count').value);if(Number.isInteger(n)&&n>=1&&n<=s.total){s.count=n;save()}else{$('toast').textContent='抽選人數請填 1～'+s.total+' 的整數。';$('count').value=s.count}};function action(name){if(compact&&window.opener&&!window.opener.closed){try{return window.opener[name]()}catch{}}return name==='draw'?draw():reset()}for(const id of ['draw','lever'])$(id).onclick=()=>action('draw');for(const id of ['reset','miniReset'])$(id).onclick=()=>action('reset');$('sound').onclick=()=>{sound=!sound;$('sound').textContent='♫ 音效：'+(sound?'開':'關');beep(600)};
window.addEventListener('storage',e=>{if(e.key===key&&!busy){try{const a=JSON.parse(e.newValue);if(a){s=a;render()}}catch{}}});
$('float').onclick=async()=>{if(pop&&!pop.closed){pop.focus();return}if(busy)return;try{if('documentPictureInPicture'in window){pop=await window.documentPictureInPicture.requestWindow({width:Math.max(320,Math.min(720,s.count*78+85)),height:205});pop.document.head.innerHTML=document.head.innerHTML;pop.document.body.innerHTML=document.body.innerHTML;pop.document.querySelectorAll('script').forEach(el=>el.remove());pop.document.body.classList.add('compact');const sync=()=>{const target=pop.document.getElementById('reels');target.innerHTML=$('reels').innerHTML;target.style.setProperty('--columns',s.count);target.className=$('reels').className;pop.document.getElementById('lever').classList.toggle('pulled',$('lever').classList.contains('pulled'));pop.document.getElementById('results').innerHTML=$('results').innerHTML;for(const id of ['draw','miniReset','lever']){pop.document.getElementById(id).disabled=$(id).disabled}pop.document.getElementById('draw').textContent=$('draw').textContent;pop.document.getElementById('toast').textContent=$('toast').textContent};for(const id of ['draw','lever'])pop.document.getElementById(id).onclick=draw;pop.document.getElementById('miniReset').onclick=reset;const observer=new MutationObserver(sync);observer.observe(document.querySelector('main'),{subtree:true,childList:true,attributes:true,characterData:true});pop.addEventListener('pagehide',()=>observer.disconnect(),{once:true});sync()}else{pop=window.open(location.pathname+'?compact=1','lucky-class-float','width='+Math.max(320,Math.min(720,s.count*78+85))+',height=230,resizable=yes');$('toast').textContent=pop?'已開啟獨立小視窗；此瀏覽器不支援固定置頂，可將視窗放在教材旁。':'請允許此網站開啟彈出式視窗，再試一次。'}}catch{$('toast').textContent='懸浮視窗未能開啟，請使用最新版 Chrome 或 Edge，並允許彈出式視窗。'}};render();if(compact){$('reels').style.setProperty('--columns',s.count);if(window.opener&&!window.opener.closed){setInterval(()=>{try{const source=window.opener.document;const target=$('reels');target.innerHTML=source.getElementById('reels').innerHTML;target.style.setProperty('--columns',Number(source.getElementById('count').value));for(const id of ['draw','lever','miniReset'])$(id).disabled=source.getElementById(id).disabled;$('lever').classList.toggle('pulled',source.getElementById('lever').classList.contains('pulled'));$('draw').textContent=source.getElementById('draw').textContent;$('toast').textContent=source.getElementById('toast').textContent}catch{}},80)}}
</script></body></html>
